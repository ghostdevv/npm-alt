[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["default", "derive"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
fern = "0.7.1"
futures-util = "0.3.31"
humantime = "2.3.0"
log = "0.4.29"
neo4rs = "0.8.0"
reqwest = { version = "0.13.1", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "json", "postgres"] }
tokio = { version = "1.49.0", features = ["full"] }
